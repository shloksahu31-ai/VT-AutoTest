name: Card Functional E2E

on:
  workflow_dispatch:
    inputs:
      cards:
        description: 'Which card specs to run (comma-separated subset or "all")'
        required: false
        default: 'all'
  schedule:
    - cron: '0 4 * * 1'

jobs:
  cards:
    timeout-minutes: 300
    runs-on: ubuntu-latest
    environment: E2E
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Check secrets presence (names only, never values)
        run: |
          for v in E2E_BASE_URL E2E_USERNAME E2E_PASSWORD E2E_TOTP_SECRET; do
            if [ -z "${!v}" ]; then echo "$v is MISSING"; else echo "$v is present"; fi
          done

      - name: Typecheck card specs
        run: |
          npx tsc --ignoreConfig --noEmit --strict --esModuleInterop --skipLibCheck \
            --ignoreDeprecations 6.0 --types node --module commonjs \
            --target esnext --moduleResolution node \
            opencode/card1-option2-functional.spec.ts \
            opencode/card2-functional.spec.ts \
            opencode/card3a-functional.spec.ts \
            opencode/card3b-functional.spec.ts \
            opencode/card4-functional.spec.ts \
            opencode/card5-functional.spec.ts \
            opencode/card6-functional.spec.ts \
            opencode/helpers/auth-guard.ts \
            opencode/helpers/hydration.ts \
            opencode/helpers/scroll-click.ts \
            opencode/helpers/ai-wait.ts \
            opencode/helpers/test-data.ts \
            opencode/helpers/pill-loop.ts \
            opencode/helpers/failure-shot.ts \
            opencode/helpers/step-log.ts

      - name: Run card specs (fresh login before each card)
        run: |
          CARDS="${{ inputs.cards }}"
          if [ "$CARDS" = "all" ] || [ -z "$CARDS" ]; then
            CARDS="card1-option2,card2,card3a,card3b,card4,card5,card6"
          fi
          STATUS=0
          for c in $(echo "$CARDS" | tr ',' ' '); do
            echo "===== SETUP before $c ====="
            npx playwright test --project=setup || STATUS=1
            echo "===== $c ====="
            npx playwright test -c opencode/playwright.$c.config.ts || STATUS=1
          done
          echo "OVERALL_STATUS=$STATUS"
          exit $STATUS

      - name: Upload evidence (JSON + PNGs + failure shots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-evidence
          path: |
            e2e/results/card1-option2/evidence-*.json
            e2e/results/card1-option2/*.png
            e2e/results/card2/evidence-*.json
            e2e/results/card2/*.png
            e2e/results/card3a/evidence-*.json
            e2e/results/card3a/*.png
            e2e/results/card3b/evidence-*.json
            e2e/results/card3b/*.png
            e2e/results/card4/evidence-*.json
            e2e/results/card4/*.png
            e2e/results/card5/evidence-*.json
            e2e/results/card5/*.png
            e2e/results/card6/evidence-*.json
            e2e/results/card6/*.png
          retention-days: 30

      - name: Upload traces and videos (failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-traces-videos
          path: |
            opencode/test-results-*/
          retention-days: 30
