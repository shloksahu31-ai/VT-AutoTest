name: Card Functional E2E

on:
  workflow_dispatch:
    inputs:
      cards:
        description: 'Which card specs to run (comma-separated subset or "all")'
        required: false
        default: 'all'
  schedule:
    - cron: '0 4 * * 1'

jobs:
  cards:
    timeout-minutes: 300
    runs-on: ubuntu-latest
    environment: E2E
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Check secrets presence (names only, never values)
        run: |
          for v in E2E_BASE_URL E2E_USERNAME E2E_PASSWORD E2E_TOTP_SECRET; do
            if [ -z "${!v}" ]; then echo "$v is MISSING"; else echo "$v is present"; fi
          done

      - name: Typecheck (tsconfig covers e2e/ + opencode/)
        run: npx tsc --noEmit

      - name: Run card specs (fresh login before each card)
        run: |
          # pipefail: without it, `cmd | tee` reports tee's exit code and a
          # failing card would still leave OVERALL_STATUS=0 (observed 2026-11-02).
          set -o pipefail
          CARDS="${{ inputs.cards }}"
          if [ "$CARDS" = "all" ] || [ -z "$CARDS" ]; then
            CARDS="card1-option1,card1-option2,card2,card3-option1,card3-option2,card4,card5,card6-option1,card6-option2,card6-option3"
          fi
          STATUS=0
          mkdir -p opencode/logs
          for c in $(echo "$CARDS" | tr ',' ' '); do
            echo "===== SETUP before $c (optional: each card logs in on demand) ====="
            npx playwright test --project=setup || echo "WARN: setup did not mint fresh state — $c will log in in-page (ensureSession)"
            echo "===== $c ====="
            npx playwright test -c opencode/playwright.$c.config.ts 2>&1 | tee "opencode/logs/$c.log" || STATUS=1
          done
          echo "OVERALL_STATUS=$STATUS"
          exit $STATUS

      - name: Console step-log summary
        if: always()
        run: |
          echo "===== STEP-LOG LINES ====="
          grep -hE '^\[(TC-|[A-Z0-9-]+ )[0-9:]+ (STEP|RUN|AUTH|LOCALE|WORKFLOW|PILL-LOOP|AI-WAIT)' opencode/logs/*.log || true

      - name: Upload per-card step logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-step-logs
          path: |
            opencode/logs/*.log
            opencode/all-cards-execution-report.md
          retention-days: 30

      - name: Upload evidence (JSON + PNGs + failure shots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-evidence
          path: |
            e2e/results/card1-option2/evidence-*.json
            e2e/results/card1-option2/*.png
            e2e/results/card2/evidence-*.json
            e2e/results/card2/*.png
            e2e/results/card3-option1/evidence-*.json
            e2e/results/card3-option1/*.png
            e2e/results/card3-option2/evidence-*.json
            e2e/results/card3-option2/*.png
            e2e/results/card4/evidence-*.json
            e2e/results/card4/*.png
            e2e/results/card5/evidence-*.json
            e2e/results/card5/*.png
            e2e/results/card6-option1/evidence-*.json
            e2e/results/card6-option1/*.png
            e2e/results/card6-option2/evidence-*.json
            e2e/results/card6-option2/*.png
            e2e/results/card6-option3/evidence-*.json
            e2e/results/card6-option3/*.png
          retention-days: 30

      - name: Upload traces and videos (failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-traces-videos
          path: |
            opencode/test-results-*/
          retention-days: 30
